<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <div th:fragment="modal">
    <div id="syncMismatchModal" class="modal device-modal device-modal--standard">
      <div class="modal-content">
        <h5>
          <i class="material-icons orange-text">warning</i>
          Mismatches detected — admin review recommended before sync.
        </h5>
        <ul id="syncMismatchList"></ul>
        <p style="color: #555" class="device-modal__secondary">
          Continuing will push uneven data to the score server. Some mistakes can't be detected automatically — when in doubt, get admin before syncing.
        </p>
      </div>
      <div class="modal-footer">
        <a href="#!" class="modal-close waves-effect btn-flat">Get admin</a>
        <a href="#!" id="syncAnywayBtn" class="modal-close waves-effect btn-flat">Sync anyway</a>
      </div>
    </div>
  </div>
</body>

</html>
