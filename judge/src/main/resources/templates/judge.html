<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0" />
    <title>Scoring</title>
    <style>
        .carousel {
            height: 100vh;
        }

        .indicators {
            visibility: hidden;
        }

        .figure-flag {
            position: absolute;
            left: 0;
            top: 90px;
            width: 345px;
            height: 280px;
            padding: 0;
            border: 0;
            border-radius: 48px;
            background: transparent !important;
            box-shadow: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            color: #d32f2f;
            cursor: pointer;
            z-index: 1;
            touch-action: none;
        }
        .figure-flag .material-icons {
            visibility: hidden;
            position: absolute;
            left: 230px;
            top: 36px;
            font-size: 56px;
            line-height: 1;
        }
        .figure-flag.selected .material-icons { visibility: visible; }
        /* Device keys can reveal focus after a tap or carousel return. Keep the target invisible. */
        .figure-flag:focus, .figure-flag:focus-visible, .figure-flag:active { outline: none; }
        .figure-flag:disabled { pointer-events: none; }

        .figure-wrapper svg path {
            fill: rgb(6, 223, 252) !important;
        }

        .figure-wrapper svg text {
            fill: green !important;
        }

        .modal {
            border-radius: 20px !important;
            max-height: 98% !important;
            top: 3% !important;
        }

        .modal-content {
            padding: 10px !important;
        }

        .scoresummary {
            
            margin-bottom: 0px !important;
            border-bottom: 1px solid #ff43002e;
        }
        @font-face {
            font-family: digitalFont;
            src: url(font/digital-7.ttf);
        }

        .pilotname {
            font-size: 6vh;
            font-weight: 500;
            line-height: 10vh;
            line-height: 3vh; 
        }

        .dir-toggle-row {
            margin-top: -14px;
            margin-bottom: 0;
        }

        .btn-change-dir {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            height: 36px;
            line-height: 36px;
            padding: 0 14px;
        }

        #modal_unsaved_scores {
            max-width: 760px;
            border: 8px solid #b71c1c;
        }

        #modal_unsaved_scores .modal-content {
            padding: 28px !important;
        }

        #modal_unsaved_scores h3 {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.15;
            margin: 0 0 20px;
        }

        #modal_unsaved_scores p {
            font-size: 1.9rem;
            font-weight: 600;
            line-height: 1.25;
            margin: 0;
        }

        #modal_unsaved_scores .modal-footer {
            height: auto;
            padding: 16px 20px 22px;
        }

        #modal_unsaved_scores .guard-icon {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 6px;
        }

        #modal_unsaved_scores .btn-large {
            height: 58px;
            line-height: 58px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        #modal_unsaved_scores .guard-cancel {
            border: 1px solid #9e9e9e;
            box-shadow: none;
        }
    </style>
    <!-- CSS  -->
    <link href="materialize/css/material_lcons.css" rel="stylesheet">
    <link href="materialize/css/materialize.min.css" type="text/css" rel="stylesheet" media="screen,projection" />
    <link href="device-toast.css" type="text/css" rel="stylesheet" media="screen,projection" />

</head>

<body style="height: 100vh !important;">



    <div class="carousel carousel-slider center">
        <div class="carousel-fixed-item center" id="buttonsDiv">
            <a class="btn waves-effect white grey-text darken-text-2" onclick="removeScore(0.5);"id="btnremovehalf">-0.5</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="removeScore(1);" id="btnremoveone">-1</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="setScore(0);" id="btnsetzero">0</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="addScore(0.5);" id="btnaddhalf">+0.5</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="addScore(1);" id="btnaddhalf">+1</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="setScore(-1);" id="btnsetbreak">Break</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="setScore(-2);" id="btnsetno">N/O</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="longDescription();" id="btnspeak">speak</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="carouselPrev();" id="btnprev">prev</a>
            <a class="btn waves-effect white grey-text darken-text-2" onclick="carouselNext();" id="btnnext">next</a>
        </div>
        <div th:each="maneuver,iterStat : ${maneuvers}" class="carousel-item yellow black-text" href="#one!">
            <button type="button" class="figure-flag" th:attr="data-figure-index=${iterStat.index}"
                    aria-label="Flag figure for review" aria-pressed="false">
                <i class="material-icons" aria-hidden="true">flag</i>
            </button>
            <div class="row" style="margin-bottom: 0px; height: 10px;">
                <p><span class="pilotname" th:text="${pilot.name + ' ('+pilot_class.substring(0,3)+' '+roundType.substring(0,3)+')'}"></span></p>
            </div>
            <div class="row">
                <div class="col s12 valign-wrapper">
                    <div class="col s4">
                        <!-- <button data-target="modal_summary" class="btn modal-trigger">Modal</button> -->
                        <div class="section" style="height: 80%">
                            <h1 style="font-family: digitalFont; font-size: 40vh; line-height: 10vh;  "
                                th:id="'score_'+ ${iterStat.index}">10</h1>
                        </div>
                    </div>
                    <div class="col s8">
                    <br>
                    <img id="my-svg" style="width:60vw; height:70vh;" class="figure-wrapper" alt="Figure Image"
                    th:attr="data-figure-index=${iterStat.index + 1}"
                    th:src="@{/man/{language}/{sequenceFolderPath}/{index}{dirletter}.svg(language=${settings.language}, sequenceFolderPath=${sequenceFolderPath}, index=${iterStat.index + 1}, dirletter=${dirletter})}"
                    onerror="this.onerror=null; this.src= sequencesBasePath + '/default/FAIL/fig_missing.svg';">
                    </div>
                </div>
            </div>
            <div class="row dir-toggle-row" th:if="${(roundType eq 'KNOWN' or roundType eq 'UNKNOWN') and iterStat.index == 0}">
                <div class="col s4 center-align" style="margin-left: 10px;">
                    <a class="waves-effect waves-light btn blue darken-1 btn-change-dir" id="btnChangeDir" href="#!">Change Dir</a>
                </div>
            </div>
            <div class="row">
                <div class="col s4 left" style="font-size: 4vh; font-weight: 500; margin-left: 10px;">
                    <span>Round <span th:text="${activeRound}"></span></span>
                    <span th:if="${roundType eq 'KNOWN'}"> Seq <span th:text="${activeSequence}"></span></span>
                    <span th:if="${roundType eq 'KNOWN' or roundType eq 'UNKNOWN'}"> Dir <span class="dirletter-label" th:text="${dirletter}"></span></span>
                </div>
                
                <h2 style="line-height: 1rem ; margin: 1rem ;" th:id="'description_'+ ${iterStat.index}">
                    <span th:if="${roundType ne 'FREESTYLE'}" th:text="'Figure '+${(iterStat.index + 1) + ' ' + maneuver.description}"></span>
                    <span th:if="${roundType eq 'FREESTYLE'}" th:text="${maneuver.description}"></span>
                </h2>
            </div>
        </div>
    </div>

    <!-- Summary Modal -->
    <div th:replace="~{summary_modal::summary_modal}"></div>

    <div id="modal_unsaved_scores" class="modal">
        <div class="modal-content white black-text center-align">
            <i class="material-icons guard-icon red-text text-darken-4">warning</i>
            <h3 id="unsavedScoreGuardTitle" class="red-text text-darken-4">Unsaved Scores</h3>
            <p id="unsavedScoreGuardMessage">Scores have not been saved and will be lost.</p>
        </div>
        <div class="modal-footer white">
            <div class="row" style="margin-bottom: 0;">
                <div class="col s5 left-align">
                    <button class="modal-close btn-large grey lighten-4 black-text guard-cancel">Cancel</button>
                </div>
                <div class="col s7 right-align">
                    <button id="unsavedScoreGuardConfirm" class="btn-large red accent-4 white-text" onclick="confirmHomeNavigation();">I Understand</button>
                </div>
            </div>
        </div>
    </div>


    <div class="fixed-action-btn">
        <a class="btn-floating btn-large red">
            <i class="large material-icons">menu</i>
        </a>
        <ul>
            <li><a class="btn-floating btn-large green" onclick="showAllButtons();">
                <i class="material-icons">view_module</i></a></li>
            <li><a class="btn-floating btn-large green" href="#!" onclick="handleHomeNavigation(event);">
                <i class="material-icons">home</i></a></li>
        </ul>
    </div>


    <!--  Scripts-->
    <script src="jquery-3.6.4.min.js"></script>
    <script src="materialize/js/materialize.js"></script>
    <script src="device-keys.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // Or with jQuery
        var score_index = 0;
        var windowHeight = window.innerHeight;
        const scores = [];
        const numOfManeuvers = /*[[${numOfManeuvers}]]*/ ;
        const round =  /*[[${activeRound}]]*/ ;
        const sequence =  /*[[${activeSequence}]]*/ ;
        const primary_id =  /*[[${pilot.primary_id}]]*/ ;
        const pilot_name =  /*[[${pilot.name}]]*/ ;
        const roundType =  /*[[${roundType}]]*/ ;
        const pilot_class =  /*[[${pilot_class}]]*/ ;
        const scoreMode =  /*[[${scoreMode}]]*/ 'global';
        const sequenceJson = JSON.parse( /*[[${sequencesjson}]]*/);
        var audio = new Audio();

        const sequencesBasePath = "/man/" + /*[[${settings.language}]]*/ ;
        const sequenceFolderPath = /*[[${sequenceFolderPath}]]*/ ;
        const audioBasePath = sequencesBasePath + "/audio";  // Score audio, Now Judging audio
        const sequenceType = /*[[${sequenceType}]]*/ ;  // Kept for backward compatibility
        let currentDirLetter = /*[[${dirletter}]]*/ 'B';

        const welcome_text = 'Now judging ' + pilot_name + ' ' + pilot_class + ' round ' + round + ' sequence ' + sequence + ' ' + roundType;
        const synth = window.speechSynthesis;
        const voices = synth.getVoices();

        let classFilter = localStorage.getItem("classFilter");
        let carouselLocked = false;  // Prevents navigation when summary modal is open
        let summaryOpen = false;
        var figureFlags = [];  // Review reminders for this judging page only; never saved or synced.
        let pendingJumpIndex = null;
        let hasUnsavedScoreInput = false;
        let homeNavigationConfirmStep = 0;

        document.addEventListener('DOMContentLoaded', function () {
            var elems = document.querySelectorAll('.modal');
            $('#ss_rows').on('scroll', updateSummaryScrollNote);
            var instances = M.Modal.init(elems, {
                dismissible:false,
                startingTop: '1%',
                startingBottom: '1%',
                onOpenStart: function(modal){
                    // Lock carousel when summary modal opens - must be handled before navigation resumes
                    if (modal.id === 'modal_summary' || modal.id === 'modal_unsaved_scores') {
                        carouselLocked = true;
                    }
                    if (modal.id === 'modal_summary') {
                        summaryOpen = true;
                    }
                },
                onOpenEnd: function(modal){
                    if (modal.id === 'modal_summary') {
                        // Measure only after Materialize has made the modal visible.
                        $('#ss_rows').scrollTop(0);
                        updateSummaryScrollNote();
                    }
                },
                onCloseEnd: function(modal){
                    // Unlock carousel when summary modal closes (Review or Save clicked)
                    if (modal.id === 'modal_summary') {
                        carouselLocked = false;
                        summaryOpen = false;
                        if (pendingJumpIndex !== null) {
                            audiolongd.pause();
                            audiolongd.currentTime = 0;
                            // Prepare audio before the carousel callback changes score_index.
                            shortdescription(pendingJumpIndex - score_index);
                            setLongDescription(pendingJumpIndex - score_index);
                            $('.carousel').carousel('set', pendingJumpIndex);
                            pendingJumpIndex = null;
                        }
                    }
                    if (modal.id === 'modal_unsaved_scores') {
                        carouselLocked = false;
                        resetHomeNavigationGuard();
                    }
                }
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            var elems = document.querySelectorAll('.fixed-action-btn');
            var instances = M.FloatingActionButton.init(elems, {
                hoverEnabled: false
            });
        });
        function setVirtualButtonVisibility(btnremovehalf, btnaddhalf, btnsetno, btnsetbreak) {
            if (btnremovehalf) {
                $('#btnremovehalf').removeAttr('disabled');
            } else {
                $('#btnremovehalf').attr('disabled', 'disabled');
            }
            if (btnaddhalf) {
                $('#btnaddhalf').removeAttr('disabled');
            } else {
                $('#btnaddhalf').attr('disabled', 'disabled');
            }
            if (btnsetno) {
                $('#btnsetno').removeAttr('disabled');
            } else {
                $('#btnsetno').attr('disabled', 'disabled');
            }
            if (btnsetbreak) {
                $('#btnsetbreak').removeAttr('disabled');
            } else {
                $('#btnsetbreak').attr('disabled', 'disabled');
            }
        }

        function updateVirtualButtons(index) {
            var scoring = sequenceJson[index].scoring;
            console.log(sequenceJson[index].scoring);
            if (scoring == "HALF") {
                setVirtualButtonVisibility(true, true, true, true);
            } else {
                setVirtualButtonVisibility(false, false, false, false);
            }
        }

        function textToSpeech() {
            synth.cancel();
            var description_id = "#description_" + score_index;
            var description_text = $(description_id).text();
            const msg = new SpeechSynthesisUtterance();
            msg.text = description_text;
            synth.speak(msg);
        }

        function shortdescription(caller_index) {
            audio.pause();
            audio.currentTime = 0;
            var audio_url = sequencesBasePath + '/' + sequenceFolderPath + '/fig' + ( score_index + caller_index + 1 ) + '.mp3';
            audio = new Audio(audio_url);
            audio.volume = 1.0;
            audio.onerror = function() {
                console.warn('Figure audio not found: ' + audio_url);
            };
            audio.play();
        }

        function longDescription() {
            // Stop short description if playing, so caller audio takes priority
            if (audio && !audio.paused) {
                audio.pause();
                audio.currentTime = 0;
            }

            if (audiolongd.paused) {
                audiolongd.play();
            } else {
                audiolongd.pause();
            }
        }  
        
        function setLongDescription(caller_index) {
            var audiolongurl = sequencesBasePath + '/' + sequenceFolderPath + '/call' + ( score_index + caller_index + 1 ) + '.mp3';
            audiolongd = new Audio(audiolongurl);
            audiolongd.onerror = function() {
                console.warn('Call audio not found: ' + audiolongurl);
            };
        }

        function NowJudgingMessage() {
            audio.pause();
            audio.currentTime = 0;
            var audio_url;
            if (roundType === 'freestyle') {
                audio_url = audioBasePath + '/now_judging_freestyle_sequence.mp3';
            } else {
                audio_url = audioBasePath + '/now_judging_' + pilot_class + '_' + roundType + '_sequence.mp3';
            }
            audio = new Audio(audio_url.toLowerCase());
            audio.volume = 1.0;
            audio.onerror = function() {
                console.warn('Now Judging audio not found: ' + audio_url);
                // Still call shortdescription even if Now Judging audio fails
                shortdescription(0);
            };
            audio.play();
            audio.addEventListener("ended", (event) => {
                shortdescription(0);
            });

        }

        function closeAllModals() {
            // Close all open modals before carousel navigation
            // EXCEPT summary modal - that requires explicit user action (Review/Save)
            var modals = document.querySelectorAll('.modal');
            modals.forEach(function(modal) {
                if (modal.id === 'modal_summary') return;  // Skip summary modal
                if (modal.id === 'modal_unsaved_scores') return;  // Skip unsaved-score warning
                var instance = M.Modal.getInstance(modal);
                if (instance && instance.isOpen) {
                    instance.close();
                }
            });
        }

        function isNumber(n) {
            return Number(n) === n;
        }

        function updateDirectionUI() {
            $('.dirletter-label').text(currentDirLetter);
            $('.figure-wrapper').each(function () {
                var figureIndex = $(this).attr('data-figure-index');
                var imagePath = sequencesBasePath + '/' + sequenceFolderPath + '/' + figureIndex + currentDirLetter + '.svg';
                $(this).attr('src', imagePath);
            });
        }

        function toggleDir() {
            currentDirLetter = currentDirLetter === 'B' ? 'C' : 'B';
            updateDirectionUI();
        }

        function markScoresUnsaved() {
            hasUnsavedScoreInput = true;
        }

        function hasUnsavedScores() {
            return hasUnsavedScoreInput || score_index > 0;
        }

        function resetHomeNavigationGuard() {
            homeNavigationConfirmStep = 0;
            $('#unsavedScoreGuardTitle').text('Unsaved Scores');
            $('#unsavedScoreGuardMessage').text('Scores have not been saved and will be lost.');
            $('#unsavedScoreGuardConfirm').text('I Understand');
        }

        function handleHomeNavigation(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (!hasUnsavedScores()) {
                window.location.href = '/';
                return;
            }

            resetHomeNavigationGuard();
            homeNavigationConfirmStep = 1;
            $('#modal_unsaved_scores').modal('open');
        }

        function confirmHomeNavigation() {
            if (homeNavigationConfirmStep === 1) {
                homeNavigationConfirmStep = 2;
                $('#unsavedScoreGuardTitle').text('Are You Sure?');
                $('#unsavedScoreGuardMessage').text('Are you sure? This cannot be undone.');
                $('#unsavedScoreGuardConfirm').text('Leave and Discard Scores');
                return;
            }

            if (homeNavigationConfirmStep === 2) {
                window.location.href = '/';
            }
        }

        function textToSpeechCustomMessage(text) {
            if (isNumber(text)) {
                //this is a number lets build url to wave file
                audio.pause();
                audio.currentTime = 0;
                var audio_url = audioBasePath + '/score/' + text + '.mp3';
                audio = new Audio(audio_url);
                audio.volume = 1.0;
                audio.play();

            } else if (text == 'BREAK') {
                audio.pause();
                audio.currentTime = 0;
                var audio_url = audioBasePath + '/score/break.mp3';
                audio = new Audio(audio_url);
                audio.volume = 1.0;
                audio.play();

            } else if (text == 'Not Observed') {
                audio.pause();
                audio.currentTime = 0;
                var audio_url = audioBasePath + '/score/not_observed.mp3';
                audio = new Audio(audio_url);
                audio.volume = 1.0;
                audio.play();

            } else if (text == 'Deadline') {
                audio.pause();
                audio.currentTime = 0;
                var audio_url = audioBasePath + '/score/deadline.mp3';
                audio = new Audio(audio_url);
                audio.volume = 1.0;
                audio.play();

            } else {
                synth.cancel();
                const msg = new SpeechSynthesisUtterance();
                msg.text = text;
                synth.speak(msg);
            }


        }
        update_index = function () {
            var activeIndicator = this.$indicators.find('.indicator-item.active');
            i = activeIndicator.index();
            score_index = i;
            console.log(score_index)
            scores[score_index] = getCurrentScore(score_index);
            updateVirtualButtons(score_index);
        }

        function getCurrentScore(index) {
            score_id = "#score_" + index
            var score_text = $(score_id).text();
            if (score_text == 'BREAK') {
                return parseFloat(-1);
            }
            if (score_text == 'N/O') {
                return parseFloat(-2);
            }
            if (score_text == 'D/LINE') {
                return parseFloat(-3);
            }
            return parseFloat($(score_id).text());
        }

        var car = $('.carousel.carousel-slider').carousel({
            fullWidth: true,
            indicators: true,
            noWrap: true,
            onCycleTo: update_index
        });
        car.height(windowHeight);
        // textToSpeechCustomMessage(welcome_text);
        NowJudgingMessage();
        setLongDescription(0);

        function carouselPrev() {
            // Block navigation if summary modal is open - user must Review or Save first
            if (carouselLocked) return;

            closeAllModals();
            $('.carousel').carousel('prev');
            audiolongd.pause();
            audiolongd.currentTime = 0;
            shortdescription(-1);
            setLongDescription(-1);
        }

        function carouselNext() {
            // Block navigation if summary modal is open - user must Review or Save first
            if (carouselLocked) return;

            closeAllModals();
            $('.carousel').carousel('next');
            audiolongd.pause();
            audiolongd.currentTime = 0;
            shortdescription(1);
            setLongDescription(1);
            submitScores(false);
            if (score_index == (numOfManeuvers - 1)) {
                // Dynamically populate summary modal rows based on actual number of maneuvers
                populateSummaryModal();
                $('#modal_summary').modal('open');
                // This is done for every score now...
                //submitScores();
            }
        }

        function populateSummaryModal() {
            var rows = $('#ss_rows').empty();
            $('#modal_summary').toggleClass('ss-scrolling', numOfManeuvers > 12);
            $('#ss_scroll_note').empty().addClass('ss-note-hidden');

            // Generate rows dynamically for each maneuver
            for (var i = 0; i < numOfManeuvers; i++) {
                var desc = sequenceJson[i] ? sequenceJson[i].description : '';
                var scoreText = formatScoreForDisplay(scores[i]);

                var row = $('<div>').addClass('scoresummary ss-row');
                $('<div>').addClass('ss-num').text(i + 1).appendTo(row);
                $('<div>').addClass('ss-desc').attr('id', 'ss_' + i + '_desc').text(desc).appendTo(row);
                var scoreCell = $('<div>').addClass('ss-score').appendTo(row);
                var scoreLabel = $('<span>').attr('id', 'ss_' + i + '_text').text(scoreText).appendTo(scoreCell);
                if (scores[i] === 0) scoreLabel.addClass('ss-zero');
                else if (scores[i] === -1 || scores[i] === -3) scoreLabel.addClass('ss-penalty');
                else if (scores[i] === -2) scoreLabel.addClass('ss-no');
                var flagCell = $('<div>').addClass('ss-flag').appendTo(row);
                if (figureFlags[i]) {
                    row.addClass('flagged');
                    $('<i>').addClass('material-icons').text('flag').appendTo(flagCell);
                }
                rows.append(row);
            }
        }

        function formatScoreForDisplay(score) {
            if (score === undefined || score === null) return '-';
            if (score === -1) return 'Break';
            if (score === -2) return 'N/O';
            if (score === -3) return 'Deadline';
            return Number(score).toFixed(1);
        }

        function updateSummaryScrollNote() {
            var rows = document.getElementById('ss_rows');
            var above = 0, below = 0, flagsAbove = 0, flagsBelow = 0;
            // Count partially hidden rows too; allow one pixel for scroll rounding.
            Array.from(rows.children).forEach(function(row) {
                if (row.offsetTop < rows.scrollTop - 1) {
                    above++;
                    if (row.classList.contains('flagged')) flagsAbove++;
                }
                if (row.offsetTop + row.offsetHeight > rows.scrollTop + rows.clientHeight + 1) {
                    below++;
                    if (row.classList.contains('flagged')) flagsBelow++;
                }
            });
            var parts = [];
            if (above) parts.push(above + ' above' + (flagsAbove ? ' (' + flagsAbove + ' flagged)' : ''));
            if (below) parts.push('Scroll for ' + below + ' more' + (flagsBelow ? ' (' + flagsBelow + ' flagged)' : ''));
            $('#ss_scroll_note').text(parts.join(' · ')).toggleClass('ss-note-hidden', parts.length === 0);
        }

        // Project 06 will wire row selection to this hook; rows are not tappable in 23.
        function jumpToFigure(index) {
            if (!Number.isInteger(index) || index < 0 || index >= numOfManeuvers) return;
            pendingJumpIndex = index;
            $('#modal_summary').modal('close');
        }

        function submitScores(done = false) {
            console.log("Scores: " + JSON.stringify(scores));
            if (done !== true) {
                return;
            }
            for (i in scores) {
                if (scores[i] == null) {
                    scores[i] = 10;
                }
            }
            console.log("Cleaned scores: " + JSON.stringify(scores));

            var postData = {
                primary_id: primary_id,
                round: round,
                sequence: sequence,
                type: roundType,
                scores: scores
            }
            $.ajax({
                type: "POST",
                url: "/api/score",
                data: JSON.stringify(postData),
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function (data) {
                    if (done) {
                        hasUnsavedScoreInput = false;
                        nextEvent(data);
                    }
                },
                error: function (errObj) {
                    let message = 'Could not save score.';
                    try {
                        message = JSON.parse(errObj.responseText).message || message;
                    } catch (e) {
                        if (errObj.responseText) {
                            message = errObj.responseText.substring(0, 120);
                        }
                    }
                    M.toast({ html: message, classes: 'red', displayLength: 5000 });
                }
            });
        }

        function addScore(increment) {
            if (increment == 0.5) {
                //check if scoring is half
                var scoring = sequenceJson[score_index].scoring;
                if (scoring != "HALF") {
                    return;
                }
            }
            var scoreFloat = getCurrentScore(score_index);
            scoreFloat = scoreFloat + increment
            if (scoreFloat > 10) {
                scoreFloat = 10;
            }
            if (scoreFloat < 0) {
                scoreFloat = 0;
            }
            scores[score_index] = scoreFloat
            markScoresUnsaved();
            console.log(scoreFloat)
            console.log(JSON.stringify(scores));

            score_id = "#score_" + score_index
            $(score_id).text(scoreFloat);
            textToSpeechCustomMessage(scoreFloat);

        }

        function removeScore(increment) {
            if (increment == 0.5) {
                //check if scoring is half
                var scoring = sequenceJson[score_index].scoring;
                if (scoring != "HALF") {
                    return;
                }
            }
            var scoreFloat = getCurrentScore(score_index);
            scoreFloat = scoreFloat - increment
            if (scoreFloat < 0) {
                scoreFloat = 0
            }
            scores[score_index] = scoreFloat
            markScoresUnsaved();
            console.log(scoreFloat)
            console.log(JSON.stringify(scores));
            score_id = "#score_" + score_index
            $(score_id).text(scoreFloat);
            textToSpeechCustomMessage(scoreFloat);
        }

        function setScore(score) {
            if (score == -1 || score == -2 || score == -3) {
                //check if scoring is half
                var scoring = sequenceJson[score_index].scoring;
                if (scoring != "HALF") {
                    return;
                }
            }
            console.log("setting score to > " + score);
            var currentScore = parseFloat(score);
            scores[score_index] = currentScore;
            markScoresUnsaved();
            score_id = "#score_" + score_index;
            if (currentScore == -1) {
                $(score_id).text('BREAK');
                textToSpeechCustomMessage('BREAK');
                //carouselNext();
            }
            if (currentScore == -2) {
                $(score_id).text('N/O');
                textToSpeechCustomMessage('Not Observed');
                //carouselNext();
            }
            if (currentScore == -3) {
                $(score_id).text('D/LINE');
                textToSpeechCustomMessage('Deadline');
                //carouselNext();
            }
            if (currentScore >= 0) {
                $(score_id).text(currentScore);
                textToSpeechCustomMessage(currentScore);
                if (currentScore == 0) {
                    //carouselNext();
                }
            }
            console.log(JSON.stringify(scores));
        }

        function nextEvent(responseData) {
            const pilotListUrl = scoreMode === 'byRound' ? '/pilot-list-round' : '/pilot-list-global';
            if (responseData.isActive) {
                // Use per-type round tracking - check if round advanced for current type
                if (responseData.activeRoundByType[roundType] > round) {
                    if (scoreMode !== 'byRound' && classFilter && classFilter != "global") {
                        window.location.replace(pilotListUrl + "?classFilter=" + classFilter);
                    } else {
                        window.location.replace(pilotListUrl);
                    }
                }
                if (responseData.activeSequenceByType[roundType] > sequence) {
                    location.reload();
                }
            } else {
                if (scoreMode !== 'byRound' && classFilter && classFilter != "global") {
                    window.location.replace(pilotListUrl + "?classFilter=" + classFilter);
                } else {
                    window.location.replace(pilotListUrl);
                }
            }
        }
        $("#buttonsDiv").hide();
        function showAllButtons() {
            $("#buttonsDiv").show();
            $('.figure-flag').prop('disabled', true);
        }

        function toggleFigureFlag(index) {
            if (!Number.isInteger(index) || index < 0 || index >= numOfManeuvers ||
                    index !== score_index || carouselLocked || $('#buttonsDiv').is(':visible')) return;
            figureFlags[index] = !figureFlags[index];
            $('.figure-flag[data-figure-index="' + index + '"]')
                .toggleClass('selected', figureFlags[index])
                .attr('aria-pressed', String(figureFlags[index]));
            audio.pause();
            audio.currentTime = 0;
            audio = new Audio(audioBasePath + '/score/' + (figureFlags[index] ? 'flagged' : 'flag_cleared') + '.mp3');
            audio.volume = 1.0;
            // Optional recordings arrive in future figures packages; missing clips must not affect flagging.
            audio.play().catch(function() {});
        }

        $('.figure-flag').each(function() {
            let startX, startY, pointerDown = false, dragged = false;
            $(this).on('touchstart mousedown', function(e) {
                // The large score target owns touches here, not the carousel behind it.
                e.stopPropagation();
            }).on('pointerdown', function(e) {
                startX = e.clientX;
                startY = e.clientY;
                pointerDown = true;
                dragged = false;
            }).on('pointermove', function(e) {
                if (pointerDown && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) dragged = true;
            }).on('pointerup pointercancel', function(e) {
                pointerDown = false;
                if (e.type === 'pointercancel') dragged = true;
            }).on('click', function(e) {
                e.stopPropagation();
                // A drag is not a tap; detail 0 allows keyboard activation after a drag.
                if (dragged && e.detail !== 0) return;
                toggleFigureFlag(Number(this.dataset.figureIndex));
            });
        });

        //add button listeners
        $(document).on("keydown", function (e) {
            var action = AeroJudgeDeviceKeys.actionFromEvent(e);
            if (!action) return;

            e.preventDefault();

            if (summaryOpen) return;

            if (action == 'plus-half') addScore(0.5);
            if (action == 'minus-half') removeScore(0.5);
            if (action == 'zero') setScore(0);
            if (action == 'deadline') setScore(-3);
            if (action == 'plus-one') addScore(1);
            if (action == 'minus-one') removeScore(1);
            if (action == 'break') setScore(-1);
            if (action == 'not-observed') setScore(-2);
            if (action == 'next') carouselNext();
            if (action == 'back') carouselPrev();
            if (action == 'caller') longDescription();
        });

        $('#btnChangeDir').on('click', function(e) {
            e.preventDefault();
            toggleDir();
        });

        updateDirectionUI();
        /*]]>*/
    </script>

</body>
