<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Time</title>
  <link rel="stylesheet" href="/materialize/css/materialize.min.css">
  <link rel="stylesheet" href="/device-gesture.css">
  <style>
    body { margin: 0; background: #f5f5f5; color: #212121; }
    #clockWarning { width: 92%; max-width: 740px; top: 6% !important; max-height: 90%; }
    #clockWarning .modal-content { padding: 24px; }
    #clockWarning h1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 18px; }
    #clockWarning p { font-size: 1.4rem; line-height: 1.3; overflow-wrap: anywhere; }
    #clockWarning .modal-footer { height: auto; padding: 12px 24px 20px; }
    #clockWarning button { text-transform: none; font-size: 1.2rem; margin-left: 12px; }
    #clockResult { min-height: 48px; }
  </style>
</head>
<body>
  <div id="clockWarning" class="modal">
    <div class="modal-content">
      <h1 id="clockWarningTitle">Device time cannot be trusted</h1>
      <p id="clockInstructions">Resync with Score to establish device time, or dismiss to continue judging.</p>
      <p id="clockResult" role="status" aria-live="polite"></p>
      <div id="clockProgress" class="progress" style="display:none"><div class="indeterminate"></div></div>
    </div>
    <div class="modal-footer">
      <button id="clockDismiss" class="btn-large grey lighten-3 black-text">Dismiss</button>
      <button id="clockResync" class="btn-large green darken-3">Resync Clock</button>
      <a id="clockContinue" href="/" class="btn-large green darken-3" style="display:none">Continue</a>
    </div>
  </div>
  <script src="/jquery-3.6.4.min.js"></script>
  <script src="/materialize/js/materialize.js"></script>
  <script>
    M.Modal.init(document.getElementById('clockWarning'), { dismissible: false }).open();
    let clockBusy = false;
    function setClockBusy(busy) {
      clockBusy = busy;
      $('#clockDismiss, #clockResync').prop('disabled', busy);
      $('#clockProgress').toggle(busy);
    }
    $('#clockResync').on('click', function () {
      if (clockBusy) return;
      setClockBusy(true);
      $('#clockResult').text('Synchronizing with Score...');
      // Score's configured timeout and the helper wait govern this request.
      $.ajax({ type: 'POST', url: '/device-time-warning/resync', dataType: 'json',
        success: function (result) {
          $('#clockResult').text(result.message);
          if (result.success) {
            $('#clockWarningTitle').text('Device time synchronized');
            $('#clockInstructions').hide();
            $('#clockResult').text('Device time is now trusted.');
            $('#clockDismiss, #clockResync').hide();
            $('#clockContinue').show();
            setTimeout(function () { window.location.replace('/'); }, 5000);
          } else { $('#clockResync').text('Retry'); }
        },
        error: function () {
          $('#clockResult').text('Clock synchronization failed: could not complete the request.');
          $('#clockResync').text('Retry');
        },
        complete: function () { setClockBusy(false); }
      });
    });
    $('#clockDismiss').on('click', function () {
      if (clockBusy) return;
      setClockBusy(true);
      $.ajax({ type: 'POST', url: '/device-time-warning/dismiss',
        success: function () { window.location.replace('/'); },
        error: function () {
          $('#clockResult').text('Could not dismiss the warning. Please try again.');
          setClockBusy(false);
        }
      });
    });
  </script>
</body>
</html>
